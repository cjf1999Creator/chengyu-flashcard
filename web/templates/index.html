<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成语积累</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <h1 class="toolbar-title">成语积累</h1>
        <span id="statsHeader" class="toolbar-stats"></span>
    </header>
    <div class="toolbar-border"></div>

    <!-- 标签栏 -->
    <nav class="tab-bar">
        <button class="tab-btn active" data-tab="import">导入</button>
        <button class="tab-btn" data-tab="library">成语库</button>
        <button class="tab-btn" data-tab="review">闪卡复习</button>
        <button class="tab-btn" data-tab="stats">统计</button>
    </nav>

    <!-- ==================== 导入标签页 ==================== -->
    <section id="tab-import" class="tab-content active">
        <div class="tab-inner">
            <div class="import-actions">
                <button class="btn btn-purple" onclick="App.importFile()">从文件导入</button>
                <button class="btn btn-accent" onclick="App.previewImport()">预览解析结果</button>
                <button class="btn btn-ghost" onclick="App.clearImport()">清空</button>
                <button class="btn btn-green btn-right" onclick="App.doImport()">确认导入</button>
                <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="App.handleFile(event)">
            </div>
            <div class="import-paned">
                <div class="import-pane">
                    <div class="pane-label">粘贴成语文本</div>
                    <textarea id="importText" class="import-textarea" placeholder="在此粘贴成语文本，格式为【成语：名称】开头..."></textarea>
                </div>
                <div class="pane-resizer" data-direction="vertical"></div>
                <div class="import-pane">
                    <div class="pane-label">解析预览</div>
                    <div id="previewArea" class="preview-area"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== 成语库标签页 ==================== -->
    <section id="tab-library" class="tab-content">
        <div class="tab-inner">
            <div class="library-search">
                <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="搜索成语..." onkeydown="if(event.key==='Enter')App.searchIdioms()">
                </div>
                <button class="btn btn-accent btn-sm" onclick="App.searchIdioms()">搜索</button>
                <button class="btn btn-ghost btn-sm" onclick="App.refreshLibrary()">显示全部</button>
            </div>
            <div class="library-paned">
                <div class="library-list-panel">
                    <div id="idiomList" class="idiom-list"></div>
                </div>
                <div class="pane-resizer" data-direction="horizontal"></div>
                <div class="library-detail-panel">
                    <div id="detailView" class="detail-view"></div>
                    <div id="detailEdit" class="detail-edit" style="display:none">
                        <textarea id="editTextarea" class="edit-textarea"></textarea>
                    </div>
                </div>
            </div>
            <div class="library-bottom">
                <button class="btn btn-red btn-sm" onclick="App.deleteIdiom()">删除选中</button>
                <div class="bottom-right">
                    <span id="editStatus" class="edit-status"></span>
                    <button id="btnCancelEdit" class="btn btn-ghost btn-sm" onclick="App.cancelEdit()" disabled>取消</button>
                    <button id="btnSave" class="btn btn-green btn-sm" onclick="App.saveEdit()" disabled>保存</button>
                    <button id="btnEdit" class="btn btn-orange btn-sm" onclick="App.enterEdit()">编辑</button>
                </div>
                <span id="libraryCount" class="library-count"></span>
            </div>
        </div>
    </section>

    <!-- ==================== 闪卡复习标签页 ==================== -->
    <section id="tab-review" class="tab-content">
        <div class="tab-inner">
            <div class="review-controls">
                <span class="review-mode-label">复习模式：</span>
                <label class="radio-label"><input type="radio" name="reviewMode" value="all" checked> 全部</label>
                <label class="radio-label"><input type="radio" name="reviewMode" value="random20"> 随机20</label>
                <label class="radio-label"><input type="radio" name="reviewMode" value="unmastered"> 未掌握</label>
                <label class="radio-label"><input type="radio" name="reviewMode" value="mastered"> 已掌握</label>
                <label class="radio-label"><input type="radio" name="reviewMode" value="bydate"> 按日期</label>
                <div class="review-controls-right">
                    <div class="font-controls">
                        <span class="font-label">字号</span>
                        <button class="btn btn-ghost btn-xs" onclick="App.fontSizeDown()">A-</button>
                        <input type="range" id="fontSlider" min="8" max="24" value="13" class="font-slider" oninput="App.setFontSize(this.value)">
                        <button class="btn btn-ghost btn-xs" onclick="App.fontSizeUp()">A+</button>
                    </div>
                    <button class="btn btn-accent btn-lg" onclick="App.startReview()">开始复习</button>
                </div>
            </div>
            <div class="review-main">
                <!-- 日历侧栏 -->
                <div id="calendarSidebar" class="calendar-sidebar">
                    <div class="cal-header">
                        <button class="cal-nav" onclick="App.calPrev()">&#9664;</button>
                        <span id="calMonthLabel" class="cal-month"></span>
                        <button class="cal-nav" onclick="App.calNext()">&#9654;</button>
                    </div>
                    <div id="calInfo" class="cal-info">选择日期以按日期复习</div>
                    <div class="cal-weekdays">
                        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                    </div>
                    <div id="calGrid" class="cal-grid"></div>
                </div>
                <!-- 闪卡区域 -->
                <div class="review-card-area">
                    <div class="review-progress">
                        <span id="progressLabel" class="progress-label">点击「开始复习」</span>
                        <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
                    </div>
                    <div class="shortcut-hint">Space = 翻转 &nbsp;&nbsp; K/→ = 下一个 &nbsp;&nbsp; J/← = 上一个 &nbsp;&nbsp; A = 认识 &nbsp;&nbsp; D = 不认识 &nbsp;&nbsp; S = 已掌握</div>
                    <div id="cardContainer" class="card-container">
                        <div id="flashcard" class="flashcard">
                            <div class="card-face card-front">
                                <div id="cardContent" class="card-content card-placeholder">
                                    <div class="card-placeholder-text">点击「开始复习」<br>进入闪卡模式</div>
                                </div>
                            </div>
                            <div class="card-face card-back">
                                <div id="cardBackContent" class="card-content"></div>
                            </div>
                        </div>
                    </div>
                    <div class="review-actions">
                        <button class="btn btn-ghost" onclick="App.prevCard()">← 上一个 (J)</button>
                        <button class="btn btn-accent btn-lg" onclick="App.flipCard()">翻转 (Space)</button>
                        <button class="btn btn-ghost" onclick="App.nextCard()">下一个 (K) →</button>
                        <div class="actions-right">
                            <button class="btn btn-orange" onclick="App.markMastered()">已掌握 (S)</button>
                            <button class="btn btn-green" onclick="App.markKnown()">认识 (A)</button>
                            <button class="btn btn-red" onclick="App.markUnknown()">不认识 (D)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== 统计标签页 ==================== -->
    <section id="tab-stats" class="tab-content">
        <div class="tab-inner">
            <div class="stats-actions">
                <button class="btn btn-accent" onclick="App.refreshStats()">刷新统计</button>
            </div>
            <div id="statsContent" class="stats-content"></div>
        </div>
    </section>

    <!-- Toast 通知 -->
    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
